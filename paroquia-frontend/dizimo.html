<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d5688">
  <title>Dízimo · Paróquia Santa Teresinha</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css?v=20261005-theme2">
</head>
<body>
  <main class="admin">
    <a class="account-back" href="index.html">← Voltar ao site</a>
    <h1>Enviar dízimo</h1>
    <p>Envie o comprovante para a secretaria analisar sua contribuição.</p>
    <form id="form">
      <label>Valor<input name="valor" type="number" step="0.01" min="0.01" required></label>
      <label>Data do pagamento<input name="data_pagamento" type="date" required></label>
      <label>Comprovante<input name="comprovante" type="file" accept="image/*,.pdf" required></label>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button>Enviar comprovante</button>
    </form>
    <h2>Histórico</h2>
    <div id="lista" class="grid"></div>
  </main>
  <script src="js/api.js?v=20261005-theme2"></script>
  <script>
    requireLogin();
    async function load(){
      try {
        const items=await api('/pagamentos_dizimo');
        document.querySelector('#lista').innerHTML=items.length?items.map(i=>`<article class="card"><div class="card-body"><h3>R$ ${Number(i.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</h3><p>${formatDate(i.data_pagamento)} · ${escapeHtml(i.status)}</p></div></article>`).join(''):'<p class="empty">Nenhum dízimo enviado.</p>';
      } catch(error) { document.querySelector('#lista').innerHTML=`<p class="empty">${escapeHtml(error.message)}</p>`; }
    }
    document.querySelector('#form').addEventListener('submit',async event=>{
      event.preventDefault();
      const feedback=document.querySelector('#feedback');
      try {
        await api('/pagamentos-dizimo',{method:'POST',body:new FormData(event.currentTarget)});
        feedback.textContent='Comprovante enviado com sucesso.';
        event.currentTarget.reset();
        await load();
      } catch(error) { feedback.textContent=error.message; }
    });
    load();
  </script>
</body>
</html>
