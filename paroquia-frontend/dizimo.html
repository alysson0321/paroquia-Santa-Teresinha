<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dízimo</title><link rel="stylesheet" href="css/style.css"></head><body><main class="admin"><h1>Enviar dízimo</h1><p>Envie o comprovante para a secretaria analisar sua contribuição.</p><form id="form"><label>Valor<input name="valor" type="number" step="0.01" min="0.01" required></label><label>Data do pagamento<input name="data_pagamento" type="date" required></label><label>Comprovante<input name="comprovante" type="file" accept="image/*,.pdf" required></label><p id="feedback" class="feedback"></p><button>Enviar comprovante</button></form><h2>Histórico</h2><div id="lista" class="grid"></div></main><script src="js/api.js"></script><script>requireLogin();async function load(){const items=await api('/pagamentos_dizimo');document.querySelector('#lista').innerHTML=items.length?items.map(i=>`<article class="card"><div class="card-body"><h3>R$ ${Number(i.valor).toFixed(2)}</h3><p>${formatDate(i.data_pagamento)} · ${escapeHtml(i.status)}</p></div></article>`).join(''):'<p class="empty">Nenhum dízimo enviado.</p>';}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/pagamentos-dizimo',{method:'POST',body:new FormData(e.target)});document.querySelector('#feedback').textContent='Comprovante enviado com sucesso.';e.target.reset();load();}catch(err){document.querySelector('#feedback').textContent=err.message;}});load();</script></body></html>
