<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d5688">
  <title>Criar conta · Paróquia Santa Teresinha</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css?v=20261005-theme1">
</head>
<body>
  <main class="admin">
    <a class="account-back" href="index.html">← Voltar ao site</a>
    <h1>Criar conta de paroquiano</h1>
    <p>Depois do cadastro, você poderá registrar intenções e enviar comprovantes de dízimo pela área da comunidade.</p>
    <form id="register-form">
      <label>Nome<input name="nome" autocomplete="name" required minlength="2"><small>Informe seu nome completo.</small></label>
      <label>E-mail<input name="email" type="email" autocomplete="email" required><small>Será usado para entrar no sistema.</small></label>
      <label>Senha<input name="senha" type="password" autocomplete="new-password" required minlength="6"><small>Use pelo menos 6 caracteres.</small></label>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button>Cadastrar</button>
      <a class="button secondary" href="login.html">Já tenho uma conta</a>
    </form>
  </main>
  <script src="js/api.js?v=20261005-theme1"></script>
  <script>
    document.querySelector('#register-form').addEventListener('submit',async event=>{
      event.preventDefault();
      const feedback=document.querySelector('#feedback');
      try {
        await api('/usuarios',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});
        feedback.textContent='Cadastro realizado. Você já pode entrar.';
        feedback.style.color='green';
        event.currentTarget.reset();
      } catch(error) { feedback.textContent=error.message; feedback.style.color='crimson'; }
    });
  </script>
</body>
</html>
