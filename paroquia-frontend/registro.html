<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta</title><link rel="stylesheet" href="css/style.css"></head><body><main class="admin"><h1>Criar conta de paroquiano</h1><p>Depois do cadastro, você poderá registrar intenções e enviar comprovantes de dízimo pela área da comunidade.</p><form id="register-form"><label>Nome<input name="nome" required minlength="2"><small>Informe seu nome completo.</small></label><label>E-mail<input name="email" type="email" required><small>Será usado para entrar no sistema.</small></label><label>Senha<input name="senha" type="password" required minlength="6"><small>Use pelo menos 6 caracteres.</small></label><p id="feedback" class="feedback"></p><button>Cadastrar</button><a class="button secondary" href="login.html">Já tenho uma conta</a></form></main><script src="js/api.js"></script><script>document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();const feedback=document.querySelector('#feedback');try{await api('/usuarios',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});feedback.textContent='Cadastro realizado. Você já pode entrar.';feedback.style.color='green';e.target.reset();}catch(err){feedback.textContent=err.message;feedback.style.color='crimson';}});</script></body></html>
