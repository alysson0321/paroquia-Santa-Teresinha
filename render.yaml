services:
  - type: web
    name: paroquia-santa-teresinha-api
    env: node
    rootDir: paroquia-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paroquia-santa-teresinha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PIX_KEY
        sync: false

databases:
  - name: paroquia-santa-teresinha-db
    plan: free
