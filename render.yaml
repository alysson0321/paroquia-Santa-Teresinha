services:
  - type: web
    name: paroquia-santa-teresinha-api
    env: node
    rootDir: paroquia-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PIX_KEY
        sync: false
